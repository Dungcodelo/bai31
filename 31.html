<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tính tích các số chia hết cho 7</title>
</head>
<body>

    <h2>Tính tích các số chia hết cho 7</h2>

    <form onsubmit="handleSubmit(event)">
        <label for="start">Số đầu:</label>
        <input type="number" id="start" step="1" required>

        <br><br>

        <label for="end">Số cuối:</label>
        <input type="number" id="end" step="1" required>

        <br><br>

        <button type="submit">Tính tích</button>
    </form>

    <h3 id="result"></h3>

    <script>
        function handleSubmit(event) {
            event.preventDefault();

            const start = parseInt(document.getElementById("start").value, 10);
            const end = parseInt(document.getElementById("end").value, 10);
            const result = document.getElementById("result");

            if (start > end) {
                result.textContent = "Số đầu phải nhỏ hơn hoặc bằng số cuối!";
                return;
            }

            // Tìm bội số của 7 đầu tiên >= start
            let first = Math.ceil(start / 7) * 7;

            let tich = 1n;   // BigInt để tránh tràn số
            let dem = 0;

            for (let i = first; i <= end; i += 7) {
                tich *= BigInt(i);
                dem++;
            }

            if (dem === 0) {
                result.textContent = "Không có số nào chia hết cho 7!";
            } else {
                result.textContent =
                    "Có " + dem + " số chia hết cho 7. Tích là: " + tich.toString();
            }
        }
    </script>

</body>
</html>
